---
# Playbook для автоматического развертывания инфраструктуры на Fedora Linux.
- name: Deploy funeral-services infrastructure
  hosts: localhost
  become: true

  tasks:
    # Обновляем все установленные пакеты через dnf.
    - name: Update Fedora packages
      ansible.builtin.dnf:
        name: "*"
        state: latest

    # Устанавливаем пакеты, необходимые для запуска проекта.
    - name: Install Docker, Docker Compose plugin and git
      ansible.builtin.dnf:
        name:
          - docker
          - docker-compose-plugin
          - git
        state: present

    # Запускаем Docker и добавляем его в автозагрузку.
    - name: Enable and start Docker service
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    # Запускаем контейнеры проекта через Docker Compose.
    - name: Build and start Docker Compose services
      ansible.builtin.command:
        cmd: docker compose up --build -d
        chdir: "{{ playbook_dir }}/.."
      changed_when: true
